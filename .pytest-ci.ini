# Configuration spécifique pour l'exécution en CI
# Ce fichier peut être utilisé avec pytest -c .pytest-ci.ini

[pytest]
addopts = 
    -v 
    --tb=short 
    --cov=app 
    --cov-report=html 
    --cov-report=term 
    --cov-report=xml 
    --junitxml=test-results.xml

# Désactiver les warnings pour les tests en CI
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout pour les tests (30 secondes par test)
timeout = 30

# Parallelisation si disponible
addopts = ${addopts} -n auto