[pytest]
# Configuration pour pytest

# Répertoires à rechercher pour les tests
testpaths = tests

# Fichiers de test à rechercher
python_files = test_*.py

# Options par défaut
addopts = -v --tb=short -n auto

# Plugins à activer
pytest_plugins =
    pytest-cov
    pytest-xdist

# Marqueurs personnalisés
markers =
    auth: tests d'authentification
    admin: tests d'administration
    main: tests des routes principales
    forms: tests de validation des formulaires
    utils: tests des fonctions utilitaires
    maps: tests des fonctionnalités de carte
    scenarios: tests de scénarios complexes
    unitary: tests unitaires
    app: tests d'application
    slow: tests lents
    critical: tests critiques
    performance: tests de performance
    csrf: tests de protection CSRF

# Configuration de coverage
[tool:pytest]
coverage:
    # Répertoires à inclure dans le coverage
    source = app
    
    # Fichiers à omettre
    omit =
        app/static/*
        app/templates/*
        */__init__.py
        */__pycache__/*
        app/config_prod.py
    
    # Configuration du rapport
    report =
        exclude_lines =
            pragma: no cover
            def __repr__
            raise NotImplementedError
            if __name__ == .__main__.:
            if TYPE_CHECKING:
            @abstractmethod
            except ImportError:
    
    # Rapport HTML
    html:
        directory = htmlcov
    
    # Rapport XML pour l'intégration CI
    xml:
        report_file = coverage.xml