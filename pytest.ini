[pytest]
# Configuration unifiée et optimisée pour pytest

# Répertoires à rechercher pour les tests
testpaths = tests

# Fichiers de test à rechercher
python_files = test_*.py

# Options par défaut MINIMALES pour le développement local
# Le coverage est géré par le CI, pas par défaut
addopts = -v --tb=short


# Marqueurs personnalisés (complets avec descriptions claires)
markers =
    # Catégories fonctionnelles
    auth: tests d'authentification et gestion des utilisateurs
    admin: tests des fonctionnalités d'administration
    main: tests des routes principales et flux utilisateur
    forms: tests de validation des formulaires
    utils: tests des fonctions utilitaires et helpers
    maps: tests des fonctionnalités de carte et géolocalisation
    api: tests des endpoints API
    
    # Types de tests
    unitary: tests unitaires (fonctions isolées)
    integration: tests d'intégration (composants ensemble)
    scenarios: tests de scénarios complexes (workflows complets)
    smoke: tests smoke (vérification rapide du fonctionnement)
    
    # Caractéristiques
    slow: tests lents (accès réseau, traitement lourd)
    critical: tests critiques (doivent absolument passer)
    performance: tests de performance et optimisation
    csrf: tests de protection CSRF
    
    # Contextes spécifiques
    regression: tests de régression (prévention des régressions)
    deployment: tests de déploiement (nécessitent l'accès au site en production, activés avec RUN_DEPLOYMENT_TESTS=true)

# Configuration de coverage (utilisée quand --cov est activé)
[tool:pytest]
coverage:
    # Répertoires à inclure dans le coverage
    source = app
    
    # Fichiers à omettre (aligné avec les bonnes pratiques)
    omit =
        app/static/*
        app/templates/*
        */__init__.py
        */__pycache__/*
        app/config_prod.py
        app/configprod.py
        */conftest.py

    # Configuration du rapport
    report =
        exclude_lines =
            pragma: no cover
            def __repr__
            raise NotImplementedError
            if __name__ == .__main__.:
            if TYPE_CHECKING:
            @abstractmethod
            except ImportError:
            pass
            return NotImplemented
    
    # Rapport HTML
    html:
        directory = htmlcov
        # Toujours générer le rapport HTML
        always = True
    
    # Rapport terminal
    term:
        report = True
        skip_covered = False
        precision = 1
    
    # Rapport XML pour CI/CD
    xml:
        directory = .
        report_file = coverage.xml
        # Toujours générer le rapport XML pour CI/CD
        always = True