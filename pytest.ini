[pytest]
# Configuration pour pytest

# Répertoires à rechercher pour les tests
testpaths = tests

# Fichiers de test à rechercher
python_files = test_*.py

# Options par défaut
addopts = -v --tb=short

# Plugins à activer
pytest_plugins =
    pytest-cov

# Configuration de coverage
[tool:pytest]
coverage:
    # Répertoires à inclure dans le coverage
    source = app
    
    # Fichiers à omettre
    omit =
        app/static/*
        app/templates/*
        */__init__.py
        */__pycache__/*
    
    # Configuration du rapport
    report =
        exclude_lines =
            pragma: no cover
            def __repr__
            raise NotImplementedError
            if __name__ == .__main__.:
            if TYPE_CHECKING:
            @abstractmethod
    
    # Rapport HTML
    html:
        directory = htmlcov