upstream planflan_upstream_back {
   server planflan-backend:5000;
}

# Configuration pour le développement local (sans SSL)
server {
  listen 80;
  listen [::]:80;

  server_name localhost;

  client_max_body_size 0;

  # Servir les fichiers uploads directement depuis le volume partagé
  location /static/uploads/ {
    alias /var/www/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Proxy vers le backend
  location / {
    proxy_pass http://planflan_upstream_back;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 300s;
  }
}
