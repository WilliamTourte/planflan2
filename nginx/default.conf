upstream planflan_upstream_back {
   server planflan-backend:5000;
}

# Serveur HTTP pour la redirection et les défis ACME
server {
  listen 80;
  listen [::]:80;

  server_name planflan.fr www.planflan.fr;

  # Location pour les défis ACME (Let's Encrypt)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirection vers HTTPS (à activer après avoir obtenu le certificat)
  # location / {
  #   return 301 https://$host$request_uri;
  # }

  # Proxy vers le backend (temporairement en HTTP)
  location / {
    proxy_pass http://planflan_upstream_back;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Servir les fichiers uploads directement depuis le volume partagé
  location /static/uploads/ {
    alias /var/www/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}


 server {
   listen 443 ssl;
   listen [::]:443 ssl;
   listen 80;

   server_name planflan.fr www.planflan.fr;
   server_tokens off;

   # Chemins des certificats Let's Encrypt
   ssl_certificate /etc/letsencrypt/live/planflan.fr/fullchain.pem;
   ssl_certificate_key /etc/letsencrypt/live/planflan.fr/privkey.pem;

   # Paramètres SSL recommandés
   ssl_protocols TLSv1.2 TLSv1.3;
   ssl_prefer_server_ciphers on;
   ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
   ssl_session_timeout 1d;
   ssl_session_cache shared:SSL:50m;
   ssl_stapling on;
   ssl_stapling_verify on;

   client_max_body_size 0;

   # Servir les fichiers uploads directement depuis le volume partagé
   location /static/uploads/ {
     alias /var/www/uploads/;
     expires 30d;
     add_header Cache-Control "public, immutable";
   }

   # Proxy vers le backend
   location / {
     proxy_pass http://planflan_upstream_back;
     proxy_http_version 1.1;
     proxy_set_header Upgrade $http_upgrade;
     proxy_set_header Connection 'upgrade';
     proxy_set_header Host $host;
     proxy_cache_bypass $http_upgrade;
     proxy_connect_timeout 300s;
   }
    # Indispensable pour le challenge Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
 }