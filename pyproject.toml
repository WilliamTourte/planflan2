[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planflan3"
version = "1.0.0"
description = "PlanFlan - Application Flask pour trouver et noter les flans"
authors = [{name = "William Tourte"}]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | env
  | venv
  | node_modules
)/
'''

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-few-public-methods",
]
max-line-length = 100

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["app"]

[tool.pytest.ini_options]
# Configuration minimale - pytest.ini est utilisé en priorité
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/static/*",
    "app/templates/*",
    "*/__init__.py",
    "*/__pycache__/*",
    "app/config_prod.py",
    "app/configprod.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "except ImportError:",
    "pass",
    "return NotImplemented",
]
