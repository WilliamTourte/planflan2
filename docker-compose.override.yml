# Docker Compose Override pour le développement local
# Ce fichier est automatiquement fusionné avec docker-compose.yml
# Il permet de personnaliser la configuration pour le développement local

services:
  planflan-service-db:
    # Utiliser le port 3307 en local pour éviter les conflits avec MySQL local
    ports:
      - "3307:3306"

  planflan-backend:
    # En développement, on peut vouloir voir les logs en temps réel
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    # Monter le code source pour le hot-reload (optionnel)
    # volumes:
    #   - ./app:/app/app:ro

  nginx:
    # Utiliser le port 81 en local pour éviter les conflits avec d'autres services
    ports:
      - "81:80"
      # Désactiver HTTPS en local (pas de certificats SSL requis)
      # - "443:443"
    volumes:
      # Utiliser la configuration Nginx pour le développement local (sans SSL)
      # On monte UNIQUEMENT le fichier dev, pas le répertoire entier
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf
      # Désactiver le montage du répertoire nginx pour éviter les doublons
      # - ./nginx:/etc/nginx/conf.d/
      # Désactiver les volumes Let's Encrypt en local
      # - ./certbot/conf:/etc/letsencrypt
      # - ./certbot/www:/var/www/certbot

  # Désactiver certbot en local (pas besoin de certificats SSL)
  certbot:
    profiles:
      - production

