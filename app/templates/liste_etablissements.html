{% extends "base.html" %}

{% block scripts_head %}
<meta name="csrf-token" content="{{ csrf_token() }}">
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>




<!-- Style pour le bouton de géolocalisation avec fond transparent - Spécificité renforcée -->
<style>
    /* Style de base avec !important pour éviter les conflits */
    button#geolocate-me {
        background-color: transparent !important;
        border: 2px solid #4CAF50 !important;
        border-radius: 50% !important;
        width: 50px !important;
        height: 50px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-shadow: none !important;
        transition: all 0.3s ease !important;
        padding: 0 !important;
        margin: 0 !important;
        line-height: normal !important;
    }
    
    /* Effet de survol */
    button#geolocate-me:hover {
        background-color: transparent !important;
        transform: scale(1.1) !important;
        border-color: #2E7D32 !important;
    }
    
    /* Style de l'icône */
    button#geolocate-me i.bi-geo-alt {
        font-size: 24px !important;
        color: #4CAF50 !important;
        transition: color 0.3s ease !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    
    /* Effet de survol de l'icône */
    button#geolocate-me:hover i.bi-geo-alt {
        color: #2E7D32 !important;
    }
    
    /* Réinitialisation des styles Bootstrap qui pourraient interférer */
    button#geolocate-me.btn,
    button.geolocate-button {
        background-image: none !important;
        background: none !important;
        outline: none !important;
        box-shadow: none !important;
    }
    
    /* Style supplémentaire pour la classe spécifique */
    .geolocate-button {
        appearance: none !important;
        -webkit-appearance: none !important;
        -moz-appearance: none !important;
    }
</style>

<!-- Inclure le fichier JavaScript externe -->
<script src="{{ url_for('static', filename='js/map_filter.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/geoloc.js') }}" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const etablissementsData = {{ etablissements_json|tojson|safe }};
    const etablissementsDataElement = document.createElement('div');
    etablissementsDataElement.id = 'etablissements-data';
    etablissementsDataElement.setAttribute('data-etablissements', JSON.stringify(etablissementsData));
    document.body.appendChild(etablissementsDataElement);

    const isAdminElement = document.createElement('div');
    isAdminElement.id = 'is-admin';
    isAdminElement.setAttribute('data-is-admin', {{ current_user.is_admin|tojson|safe if current_user.is_authenticated else 'false' }});
    document.body.appendChild(isAdminElement);

    const googleMapsApiKeyElement = document.createElement('div');
    googleMapsApiKeyElement.id = 'google-maps-api-key';
    googleMapsApiKeyElement.setAttribute('data-api-key', '{{ google_maps_api_key }}');
    document.body.appendChild(googleMapsApiKeyElement);

    // Ajout des coordonnées utilisateur si disponibles
    {% if user_lat and user_lon %}
    const userLocationElement = document.createElement('div');
    userLocationElement.id = 'user-location';
    userLocationElement.setAttribute('data-lat', {{ user_lat }});
    userLocationElement.setAttribute('data-lon', {{ user_lon }});
    document.body.appendChild(userLocationElement);
    {% endif %}
    
    // Ajout de la ville sélectionnée si disponible
    {% if ville_selectionnee %}
    const villeSelectionneeElement = document.createElement('div');
    villeSelectionneeElement.id = 'ville-selectionnee';
    villeSelectionneeElement.setAttribute('data-ville', '{{ ville_selectionnee }}');
    document.body.appendChild(villeSelectionneeElement);
    {% endif %}
});
</script>
{% endblock %}

{% block content %}
<div id="map-container" class="d-flex flex-column align-items-center" style="position: relative; height: 80vh; width: 100%;">
    <!-- Carte -->
    <div id="map" style="width: 100%; height: 100%;"></div>

    <!-- Filtres (positionnés en absolu sur la carte) -->
<div id="filter-controls">
    <div class="main-filters">
        <button id="filter-all" class="btn btn-success">Tous</button>
        <button id="filter-pate-btn" class="btn btn-success">Pâte</button>
        <button id="filter-statut-btn" class="btn btn-success">Statut</button>
    </div>
    <div id="sub-filters" class="sub-filters"></div>
</div>

<!-- Bouton de géolocalisation avec fond transparent et classe spécifique -->
<button type="button" id='geolocate-me' class="geolocate-button" style="position: absolute; bottom: 20px; right: 20px; z-index: 1000;">
    <i class="bi bi-geo-alt"></i>
</button>
    




<!-- Bouton "Proposer une adresse" (sous la carte) -->
<div class="mt-3 mb-3" style="z-index: 1;">
    <a href="{{ url_for('maps.proposer_etablissement') }}" class="btn btn-success " role="button">
        Proposer une adresse
    </a>
</div>

</div>


{% endblock %}
