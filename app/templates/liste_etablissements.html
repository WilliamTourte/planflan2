{% extends "base.html" %}
{% block page_type %}liste_etablissements{% endblock %}
{% block scripts_head %}
<meta name="csrf-token" content="{{ csrf_token() }}" />
<!-- Leaflet CSS & JS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

<!-- Données pour le script externe -->
<div id="etablissements-data" data-etablissements='{{ etablissements_json|tojson|safe }}'></div>
<div id="is-admin" data-is-admin="{{ current_user.is_admin|tojson|safe if current_user.is_authenticated else 'false' }}"></div>
<div id="google-maps-api-key" data-api-key="{{ google_maps_api_key }}"></div>
{% if user_lat and user_lon %}
<div id="user-location" data-lat="{{ user_lat }}" data-lon="{{ user_lon }}"></div>
{% endif %}
{% if ville_selectionnee %}
<div id="ville-selectionnee" data-ville="{{ ville_selectionnee }}"></div>
{% endif %}

<!-- Le script liste_etablissements.js n'est plus nécessaire, tout est géré par main.js -->
{% endblock %} {% block content %}
<div class="container-fluid p-0 d-flex flex-column" style="height: calc(100vh - 120px);">
  <!-- Carte - 90% de la hauteur -->
  <div class="flex-grow-1" style="height: 90%;">
    <div id="map-container" class="position-relative w-100 h-100">
      <div id="map" class="w-100 h-100"></div>

      <!-- Filtres pour établissements (dans la carte) -->
      <div id="filter-controls" class="position-absolute top-0 start-50 translate-middle-x w-100 px-2">
        <div class="main-filters d-flex flex-wrap justify-content-center gap-2">
          <button
            id="filter-all"
            class="btn btn-success flex-grow-1 flex-sm-grow-0"
            title="Afficher tous les établissements"
          >
            Tous
          </button>
          <button
            id="filter-pate-btn"
            class="btn btn-success flex-grow-1 flex-sm-grow-0"
            title="Filtrer par type de pâte"
          >
            Pâte
          </button>
          <button
            id="filter-saveur-btn"
            class="btn btn-success flex-grow-1 flex-sm-grow-0"
            title="Filtrer par saveur"
          >
            Saveur
          </button>
          <button
            id="filter-statut-btn"
            class="btn btn-success flex-grow-1 flex-sm-grow-0"
            title="Filtrer par statut"
          >
            Statut
          </button>
        </div>
        <!-- Sous-filtres pour affiner selon les critères choisis -->
        <div id="sub-filters" class="sub-filters"></div>
      </div>
    </div>
  </div>

  <!-- Bouton - 10% de la hauteur -->
  <div class="d-flex align-items-center justify-content-center" style="height: 10%; min-height: 60px;">
    <a
      href="{{ url_for('maps.proposer_etablissement') }}"
      class="btn btn-success"
      role="button"
    >
      Proposer une adresse
    </a>
  </div>
</div>

{% endblock %}
