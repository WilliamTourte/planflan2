<!DOCTYPE html>
<html>
<head>
    <title>Images téléversées</title>
</head>
<body>
    <h1>Images téléversées</h1>
    <div class="uploads">
        {% for upload in uploads %}
        <div class="upload">
            <img src="{{ url_for('static', filename='uploads/' + upload) }}" alt="{{ upload }}">
            <p>{{ upload }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
