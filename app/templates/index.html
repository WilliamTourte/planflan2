{% extends "base.html" %}
{% block scripts_head %}
<meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ url_for('static', filename='js/geoloc.js') }}" defer></script>
{% endblock %}
{% block styles %}
<style>
    .autocomplete {
        position: relative;
        width: 100%;
    }
    
    .autocomplete-input {
        width: 100%;
        padding: 0.5rem;
        background-color: rgba(255, 255, 255, 0.9);
        border-radius: var(--border-radius-btn);
        border: 1px solid #ddd;
    }
    
    .autocomplete-results {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background-color: white;
        border: 1px solid #ddd;
        border-top: none;
        border-radius: 0 0 var(--border-radius-btn) var(--border-radius-btn);
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000;
        display: none;
    }
    
    .autocomplete-results.show {
        display: block;
    }
    
    .autocomplete-item {
        padding: 0.5rem;
        cursor: pointer;
        border-bottom: 1px solid #eee;
    }
    
    .autocomplete-item:hover {
        background-color: #f0f0f0;
    }
    
    .autocomplete-item:last-child {
        border-bottom: none;
    }
    
    .autocomplete-loading {
        padding: 0.5rem;
        text-align: center;
        color: #666;
        font-style: italic;
    }
    
    .autocomplete-no-results {
        padding: 0.5rem;
        text-align: center;
        color: #999;
        font-style: italic;
    }
    
    .autocomplete-item.active {
        background-color: #e3f2fd;
    }
</style>
{% endblock %}
{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 100vh; padding: var(--padding-lg);">
    <h1 class="text-white" style="font-family: var(--font-bubblegum); font-size: 3.5rem; margin-bottom: var(--margin-lg); text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);">
        PLANFLAN
    </h1>

<form action="{{ url_for('main.liste_etablissements') }}" method="POST" class="form-container">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {{ form_recherche.ville(class="d-none") }}  {# Champ caché pour le formulaire #}
    <div class="form-group autocomplete">
        <input type="text" 
               id="ville-autocomplete" 
               class="autocomplete-input py-2" 
               placeholder="Ville" 
               autocomplete="off">
        <div id="autocomplete-results" class="autocomplete-results"></div>
    </div>

    <button type="submit" class="btn btn-success">
        Rechercher
    </button>
</form>

<a href="{{ url_for('maps.proposer_etablissement') }}" class="btn btn-success" role="button">
    Proposer une adresse
</a>
</div>
{% endblock %}

{% block scripts %}
<script>
// Debug: Check if this script is loaded
console.log('Autocomplete script block loaded');

// More robust approach: try immediately and fallback to DOMContentLoaded
function initAutocomplete() {
    console.log('Trying to initialize autocomplete...');
    
    const input = document.getElementById('ville-autocomplete');
    const resultsContainer = document.getElementById('autocomplete-results');
    let currentFocus = -1;
    
    if (!input || !resultsContainer) {
        console.log('Elements not found yet, waiting for DOM...');
        return false;
    }
    
    console.log('Elements found, initializing autocomplete');
    

    // Rest of the autocomplete code
    // Débounce function pour limiter les requêtes API
    function debounce(func, timeout = 300) {
        let timer;
        return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => { func.apply(this, args); }, timeout);
        };
    }
    
    // Fonction pour synchroniser avec le champ caché du formulaire
    function syncWithHiddenField() {
        const hiddenField = document.querySelector('input[name="ville"]');
        if (hiddenField) {
            console.log('Syncing hidden field with:', input.value);
            hiddenField.value = input.value;
        } else {
            console.warn('Hidden ville field not found');
        }
    }
    
    // Fonction pour afficher l'indicateur de chargement
    function showLoading() {
        resultsContainer.innerHTML = '';
        const loading = document.createElement('div');
        loading.className = 'autocomplete-loading';
        loading.textContent = 'Recherche en cours...';
        resultsContainer.appendChild(loading);
        resultsContainer.classList.add('show');
    }
    
    // Fonction pour afficher les résultats
    function showResults(villes) {
        console.log('showResults called with:', villes);
        resultsContainer.innerHTML = '';
        
        if (villes.length === 0) {
            const noResults = document.createElement('div');
            noResults.className = 'autocomplete-no-results';
            noResults.textContent = 'Aucune ville trouvée';
            resultsContainer.appendChild(noResults);
            resultsContainer.classList.add('show');
            console.log('No results found, showing no results message');
            return;
        }
        
        console.log('Showing results for:', villes);
        villes.forEach(ville => {
            const div = document.createElement('div');
            div.className = 'autocomplete-item';
            div.textContent = ville;
            div.addEventListener('click', function() {
                input.value = ville;
                syncWithHiddenField();
                resultsContainer.classList.remove('show');
            });
            resultsContainer.appendChild(div);
        });
        
        resultsContainer.classList.add('show');
        console.log('Results container should now be visible');
        console.log('Results container classes:', resultsContainer.className);
        console.log('Results container style:', resultsContainer.style.display);
    }
    
    // Fonction pour récupérer les villes depuis l'API
    async function fetchVilles(query) {
        console.log('fetchVilles called with query:', query);
        
        if (query.length < 2) {
            console.log('Query too short, hiding results');
            resultsContainer.classList.remove('show');
            return;
        }
        
        try {
            console.log('Fetching villes from API...');
            showLoading();
            const response = await fetch(`/api/villes?q=${encodeURIComponent(query)}`);
            console.log('API response status:', response.status);
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const villes = await response.json();
            console.log('API response data:', villes);
            showResults(villes);
        } catch (error) {
            console.error('Erreur lors de la récupération des villes:', error);
            resultsContainer.innerHTML = '';
            const errorDiv = document.createElement('div');
            errorDiv.className = 'autocomplete-no-results';
            errorDiv.textContent = 'Erreur de chargement: ' + error.message;
            resultsContainer.appendChild(errorDiv);
            resultsContainer.classList.add('show');
        }
    }
    
    // Événement input avec débounce
    const debouncedFetch = debounce(fetchVilles);
    input.addEventListener('input', function(e) {
        console.log('Input event:', e.target.value);
        
        // Visual feedback for input
        input.style.backgroundColor = '#fffde7';
        setTimeout(() => {
            input.style.backgroundColor = '';
        }, 200);
        
        debouncedFetch(e.target.value);
    });
    
    // Synchroniser avec le champ caché lors de la saisie
    input.addEventListener('input', function(e) {
        console.log('Syncing with hidden field:', e.target.value);
        syncWithHiddenField();
    });
    
    // Synchroniser avec le champ caché lors de la sélection avec le clavier
    input.addEventListener('keydown', function(e) {
        console.log('Key down event:', e.key);
        if (e.key === 'Enter') {
            console.log('Enter key pressed, syncing with hidden field');
            syncWithHiddenField();
        }
    });
    
    // Gestion du clic en dehors pour fermer les résultats
    document.addEventListener('click', function(e) {
        if (e.target !== input) {
            resultsContainer.classList.remove('show');
        }
    });
    
    console.log('Autocomplete fully initialized!');
    
    return true;
}

// Try to initialize immediately
if (!initAutocomplete()) {
    // Fallback to DOMContentLoaded if elements not found
    console.log("Falling back to DOMContentLoaded...");
    document.addEventListener("DOMContentLoaded", initAutocomplete);
}
</script>
{% endblock %}
