<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanFlan - Proposer un établissement</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #4a90e2;
            color: white;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        select, input[type="checkbox"] {
            padding: 8px;
            width: 100%;
            max-width: 300px;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #f5d76e;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Proposer un établissement</h2>
    <form>
        <div class="form-group">
            <label for="etablissement">Nom de l'établissement</label>
            <select id="etablissement">
                <option>Boulangerie</option>
            </select>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox"> Visité
            </label>
            <label>
                <input type="checkbox"> Labellisé EF
            </label>
        </div>
        <button type="submit">Proposer une adresse</button>
    </form>
</body>
</html>
