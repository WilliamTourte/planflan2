{% extends "base.html" %}
{% from "macros.html" import afficher_objet %}

{% block content %}
{% set current_page = 'page_evaluation' %}

{{ afficher_objet('evaluation', evaluation, current_user, form, current_page) }}

<!-- Boutons retour -->

<div class="action-buttons">
    <button onclick="goBackOrRedirect('{{ url_for('main.afficher_flan_unique', id_flan=evaluation.flan.id_flan) }}')" class="btn btn-danger" title="Retour à la page précédente">
        <i class="bi bi-arrow-return-left me-2"></i> Retour
    </button>
    <button href="{{ url_for('main.afficher_flan_unique', id_flan=evaluation.flan.id_flan) }}" class="btn btn-success" title="Retour au flan">
        <i class="bi bi-cake2 me-2"></i> Flan
    </button>
</div>
{% endblock %}
