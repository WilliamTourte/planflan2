{% extends "base.html" %} {% from "macros.html" import afficher_objet %} {%block
content %} {% set current_page = 'page_evaluation' %}
{{afficher_objet('evaluation', evaluation, current_user, form, current_page,
delete_form, validate_form) }}

<!-- Boutons retour -->

<div class="action-buttons">
  <button
    id="back-button"
    class="btn btn-danger"
    title="Retour à la page précédente"
    data-fallback="{{ url_for('main.afficher_flan_unique', id_flan=evaluation.flan.id_flan) }}"
  >
    <i class="bi bi-arrow-return-left"></i>
    Retour
  </button>
  <a
    href="{{ url_for('main.afficher_flan_unique', id_flan=evaluation.flan.id_flan) }}"
    class="btn btn-primary"
    title="Retour au flan"
  >
    <i class="bi bi-cake2"></i>
    Flan
  </a>
</div>

<script nonce="{{ csp_nonce }}">
  // Ajouter l'écouteur d'événement pour le bouton retour
  document.getElementById("back-button").addEventListener("click", function () {
    goBackOrRedirect(this.getAttribute("data-fallback"))
  })

  // Vérifier si on doit afficher automatiquement le formulaire d'édition
  document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const editMode = urlParams.get('edit');
    
    if (editMode === 'true') {
      // Récupérer l'ID de l'évaluation depuis l'URL
      const evaluationId = {{ evaluation.id_eval }};
      
      // Masquer l'affichage et montrer le formulaire d'édition
      const displayElement = document.getElementById('evaluation-' + evaluationId + '-display');
      const editElement = document.getElementById('evaluation-' + evaluationId + '-edit');
      
      if (displayElement && editElement) {
        displayElement.style.display = 'none';
        editElement.style.display = 'block';
        
        // Faire défiler jusqu'au formulaire pour une meilleure expérience utilisateur
        editElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  });
</script>
{% endblock %}
