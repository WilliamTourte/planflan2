name: CI Pipeline

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'entrypoint.sh'
      - 'app/**'
      - 'tests/**'
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'entrypoint.sh'
      - 'app/**'
      - 'tests/**'

# Annuler les runs en cours si un nouveau commit est pushé
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  DOCKER_IMAGE_NAME: 'planflan.backend'
  DOCKER_IMAGE_TAG: 'ci-${{ github.run_number }}'

jobs:
  check-commit:
    name: Check if commit was already processed
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check_commit.outputs.should_skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch dev branch
        if: github.ref == 'refs/heads/main'
        run: git fetch origin dev:dev

      - name: Check commit status
        id: check_commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # For main branch: check if commit was already validated on dev
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Checking if commit was already validated on dev branch..."
            
            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "Current commit: $CURRENT_COMMIT"
            
            # Check if this exact commit exists on dev branch
            if git branch -r --contains $CURRENT_COMMIT | grep -q "origin/dev"; then
              echo "Commit exists on dev branch. Checking CI status..."
              
              # Query GitHub API for commit status
              CI_STATUS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/commits/$CURRENT_COMMIT/status" \
                | jq -r '.state')
              
              echo "CI status on dev: $CI_STATUS"
              
              if [ "$CI_STATUS" = "success" ]; then
                # Also check if workflow runs were successful
                WORKFLOW_STATUS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/${{ github.repository }}/commits/$CURRENT_COMMIT/check-runs" \
                  | jq -r '[.check_runs[] | select(.name == "Run Tests" or .name == "Build Docker Image")] | all(.conclusion == "success")')
                
                echo "Workflow runs successful: $WORKFLOW_STATUS"
                
                if [ "$WORKFLOW_STATUS" = "true" ]; then
                  echo "✅ Commit already validated on dev. Skipping CI..."
                  echo "should_skip=true" >> $GITHUB_OUTPUT
                else
                  echo "⚠️ Workflow runs not all successful. Running CI..."
                  echo "should_skip=false" >> $GITHUB_OUTPUT
                fi
              else
                echo "⚠️ CI status not successful on dev. Running CI..."
                echo "should_skip=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "Commit not found on dev branch. Running CI..."
              echo "should_skip=false" >> $GITHUB_OUTPUT
            fi
          else
            # For dev branch or other branches: always run CI
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: check-commit
    if: needs.check-commit.outputs.should_skip == 'false'
    
    env:
      # Utiliser SQLite en mémoire pour les tests CI
      TESTING: true
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      SECRET_KEY: test-secret-key-for-ci
      WTF_CSRF_ENABLED: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-prod.txt

    - name: Start timing - Dependencies installation
      run: echo "DEPS_START=$(date +%s)" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: End timing - Dependencies installation
      run: |
        DEPS_END=$(date +%s)
        DEPS_DURATION=$((DEPS_END - DEPS_START))
        echo "⏱️ Dependencies installation took ${DEPS_DURATION}s"

    - name: Start timing - Security checks
      run: echo "SECURITY_START=$(date +%s)" >> $GITHUB_ENV

    - name: Run security checks
      run: |
        pip install bandit safety
        echo "Running Bandit security scan..."
        bandit -r app/ -ll -f json -o bandit-report.json || echo "⚠️ Bandit found some issues"
        echo "Running Safety vulnerability check..."
        safety check --json || echo "⚠️ Safety found some vulnerabilities"

    - name: End timing - Security checks
      run: |
        SECURITY_END=$(date +%s)
        SECURITY_DURATION=$((SECURITY_END - SECURITY_START))
        echo "⏱️ Security checks took ${SECURITY_DURATION}s"

    - name: Start timing - Tests
      run: echo "TESTS_START=$(date +%s)" >> $GITHUB_ENV

    - name: Run smoke tests (dev branch)
      if: github.ref == 'refs/heads/dev'
      run: |
        echo "🚀 Running SMOKE tests for dev branch..."
        python -m pytest tests/ -m "smoke" -v --tb=short

    - name: Run regression tests (main branch)
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🔍 Running REGRESSION tests for main branch..."
        python -m pytest tests/ -m "regression" --cov=app --cov-report=xml --cov-report=term -v --tb=short

    - name: Run all tests (pull request)
      if: github.event_name == 'pull_request'
      run: |
        echo "🧪 Running ALL tests for pull request..."
        python -m pytest tests/ --cov=app --cov-report=xml --cov-report=term -v --tb=short

    - name: End timing - Tests
      run: |
        TESTS_END=$(date +%s)
        TESTS_DURATION=$((TESTS_END - TESTS_START))
        echo "⏱️ Tests took ${TESTS_DURATION}s"

    - name: Upload coverage reports
      if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/


  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [check-commit, test]
    if: needs.check-commit.outputs.should_skip == 'false'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Start timing - Docker build
      run: echo "DOCKER_START=$(date +%s)" >> $GITHUB_ENV

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
        cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/cache:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/cache:buildcache,mode=max

    - name: End timing - Docker build
      run: |
        DOCKER_END=$(date +%s)
        DOCKER_DURATION=$((DOCKER_END - DOCKER_START))
        echo "⏱️ Docker build took ${DOCKER_DURATION}s"

    - name: Test Docker image
      run: |
        echo "🔍 Verifying Docker image was built..."
        docker images | grep ${{ env.DOCKER_IMAGE_NAME }}

    - name: Push Docker image (main branch only)
      if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
        cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/cache:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/cache:buildcache,mode=max

    - name: Workflow timing summary
      if: always()
      run: |
        echo "📊 CI Workflow Timing Summary"
        echo "================================"
        echo "✅ All steps completed successfully"
