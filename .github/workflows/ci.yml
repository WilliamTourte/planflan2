name: CI Pipeline

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'entrypoint.sh'
      - 'app/**'
      - 'tests/**'
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'entrypoint.sh'
      - 'app/**'
      - 'tests/**'

env:
  PYTHON_VERSION: '3.12'
  DOCKER_IMAGE_NAME: 'planflan.backend'
  DOCKER_IMAGE_TAG: 'ci-${{ github.run_number }}'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt





    - name: Run deployment tests (if enabled)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
      env:
        RUN_DEPLOYMENT_TESTS: "false"  # Disabled in CI as production site is not accessible
      run: |
        python -m pytest tests/test_deployment.py -v --tb=short


  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    services:
      mysql:
        image: mysql:lts
        env:
          MYSQL_ROOT_PASSWORD: supermegasecuredpassword
          MYSQL_DATABASE: planflan_db
          MYSQL_USER: planflan
          MYSQL_PASSWORD: supersecuredpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }} .

    - name: Run Docker container for testing
      run: |
        docker run --name test-container -d -p 5000:5000 \
          --network host \
          -e MYSQL_USER=planflan -e MYSQL_PASSWORD=supersecuredpassword \
          -e MYSQL_DATABASE=planflan_db \
          -e MYSQL_HOST=localhost \
          -e MYSQL_ROOT_PASSWORD=supermegasecuredpassword \
          ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}

    - name: Test Docker container health
      run: |
        sleep 10
        docker ps -a
        docker logs test-container || true

    - name: Push Docker image (main branch only)
      if: github.ref == 'refs/heads/main'
      run: |
        docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }} \
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
        
        # Also tag as latest for main branch
        docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }} \
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest