name: CI Pipeline

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'entrypoint.sh'
      - 'app/**'
      - 'tests/**'
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'entrypoint.sh'
      - 'app/**'
      - 'tests/**'

env:
  PYTHON_VERSION: '3.12'
  DOCKER_IMAGE_NAME: 'planflan.backend'
  DOCKER_IMAGE_TAG: 'ci-${{ github.run_number }}'

jobs:
  check-commit:
    name: Check if commit was already processed
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check_commit.outputs.should_skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch dev branch
        if: github.ref == 'refs/heads/main'
        run: git fetch origin dev:dev

      - name: Check commit status
        id: check_commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # For main branch: check if commit was already validated on dev
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Checking if commit was already validated on dev branch..."
            
            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "Current commit: $CURRENT_COMMIT"
            
            # Check if this exact commit exists on dev branch
            if git branch -r --contains $CURRENT_COMMIT | grep -q "origin/dev"; then
              echo "Commit exists on dev branch. Checking CI status..."
              
              # Query GitHub API for commit status
              CI_STATUS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/commits/$CURRENT_COMMIT/status" \
                | jq -r '.state')
              
              echo "CI status on dev: $CI_STATUS"
              
              if [ "$CI_STATUS" = "success" ]; then
                # Also check if workflow runs were successful
                WORKFLOW_STATUS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/${{ github.repository }}/commits/$CURRENT_COMMIT/check-runs" \
                  | jq -r '[.check_runs[] | select(.name == "Run Tests" or .name == "Build Docker Image")] | all(.conclusion == "success")')
                
                echo "Workflow runs successful: $WORKFLOW_STATUS"
                
                if [ "$WORKFLOW_STATUS" = "true" ]; then
                  echo "✅ Commit already validated on dev. Skipping CI..."
                  echo "should_skip=true" >> $GITHUB_OUTPUT
                else
                  echo "⚠️ Workflow runs not all successful. Running CI..."
                  echo "should_skip=false" >> $GITHUB_OUTPUT
                fi
              else
                echo "⚠️ CI status not successful on dev. Running CI..."
                echo "should_skip=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "Commit not found on dev branch. Running CI..."
              echo "should_skip=false" >> $GITHUB_OUTPUT
            fi
          else
            # For dev branch or other branches: always run CI
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: check-commit
    if: needs.check-commit.outputs.should_skip == 'false'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt





    - name: Run deployment tests (if enabled)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
      env:
        RUN_DEPLOYMENT_TESTS: "false"  # Disabled in CI as production site is not accessible
      run: |
        python -m pytest tests/test_deployment.py -v --tb=short


  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [check-commit, test]
    if: needs.check-commit.outputs.should_skip == 'false'
    services:
      mysql:
        image: mysql:lts
        env:
          MYSQL_ROOT_PASSWORD: supermegasecuredpassword
          MYSQL_DATABASE: planflan_db
          MYSQL_USER: planflan
          MYSQL_PASSWORD: supersecuredpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Run Docker container for testing
      run: |
        docker run --name test-container -d -p 5000:5000 \
          --network host \
          -e MYSQL_USER=planflan -e MYSQL_PASSWORD=supersecuredpassword \
          -e MYSQL_DATABASE=planflan_db \
          -e MYSQL_HOST=localhost \
          -e MYSQL_ROOT_PASSWORD=supermegasecuredpassword \
          ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}

    - name: Test Docker container health
      run: |
        sleep 10
        docker ps -a
        docker logs test-container || true

    - name: Push Docker image (main branch only)
      if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
