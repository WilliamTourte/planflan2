name: Pre-Deploy Checks

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'entrypoint.sh'
      - 'app/**'
      - 'tests/**'

  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'entrypoint.sh'
      - 'app/**'
      - 'tests/**'

concurrency:
  group: pre-deploy-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  check-ci-status:
    name: Check if CI already passed
    runs-on: ubuntu-latest
    outputs:
      ci_passed: ${{ steps.check_ci.outputs.ci_passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CI status
        id: check_ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Checking CI status for commit: $CURRENT_COMMIT"
          
          # Query GitHub API for CI workflow status
          CI_STATUS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$CURRENT_COMMIT/check-runs" \
            | jq -r '[.check_runs[] | select(.name == "Run Tests" and .app.slug == "github-actions")] | .[0].conclusion // "pending"')
          
          echo "CI status: $CI_STATUS"
          
          if [ "$CI_STATUS" = "success" ]; then
            echo "✅ CI already passed for this commit"
            echo "ci_passed=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ CI not yet successful, running full pre-deploy checks"
            echo "ci_passed=false" >> $GITHUB_OUTPUT
          fi

  pre-deploy-checks:
    name: Pre-Deploy Verification
    runs-on: ubuntu-latest
    needs: check-ci-status

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit safety

    - name: Check Python syntax
      if: needs.check-ci-status.outputs.ci_passed != 'true'
      run: |
        find app/ -name "*.py" -exec python -m py_compile {} \;
        echo "Python syntax check passed"

    - name: Run security checks
      run: |
        bandit -r app/ -f json -o bandit-report.json || echo "Bandit security scan completed"
        safety check --json || echo "Safety dependency check completed"



    - name: Check Dockerfile syntax
      run: |
        docker run --rm -i hadolint/hadolint < Dockerfile || echo "Dockerfile linting completed"

    - name: Verify requirements consistency
      run: |
        python -c "
        import re
        with open('requirements.txt', 'r') as f:
            reqs = f.readlines()
        
        # Check for duplicate packages
        packages = [re.split('==|>=|<=|~=', line.strip())[0].lower() for line in reqs if line.strip() and not line.startswith('#')]
        duplicates = [p for p in packages if packages.count(p) > 1]
        
        if duplicates:
            print(f'ERROR: Duplicate packages found: {set(duplicates)}')
            exit(1)
        else:
            print('No duplicate packages found')
        "

    - name: Check for secrets in code
      run: |
        # Check for common secret patterns
        if grep -r -i -E "(password|secret|api_key|token)" app/ --include="*.py" --exclude-dir=__pycache__; then
          echo "WARNING: Potential secrets found in code"
        else
          echo "No obvious secrets found in code"
        fi

    - name: Verify database migrations
      run: |
        # Check if migration files exist and are valid
        if [ -d "migrations" ]; then
          echo "Migrations directory exists"
          ls -la migrations/
        else
          echo "No migrations directory found"
        fi

    - name: Check import statements
      run: |
        python -c "
        import sys
        import importlib
        
        # Try to import main modules
        modules = ['app', 'app.models', 'app.routes.main']
        
        for module in modules:
            try:
                importlib.import_module(module)
                print(f'✓ {module} imports successfully')
            except ImportError as e:
                print(f'✗ {module} failed to import: {e}')
                sys.exit(1)
        "

    - name: Verify configuration files
      run: |
        # Check that config files are valid Python
        python -c "
        import ast
        
        config_files = ['app/config.py', 'app/configprod.py']
        
        for config_file in config_files:
            try:
                with open(config_file, 'r') as f:
                    ast.parse(f.read())
                print(f'✓ {config_file} is valid Python')
            except (FileNotFoundError, SyntaxError) as e:
                print(f'✗ {config_file} has issues: {e}')
                exit(1)
        "

    - name: Check Docker compose configuration
      run: |
        # Basic validation of docker-compose.yml
        python -c "
        import yaml
        
        try:
            with open('docker-compose.yml', 'r') as f:
                config = yaml.safe_load(f)
            
            # Check for required services
            required_services = ['planflan-backend', 'planflan-service-db']
            missing_services = [s for s in required_services if s not in config.get('services', {})]
            
            if missing_services:
                print(f'ERROR: Missing required services: {missing_services}')
                exit(1)
            else:
                print('✓ All required services are present in docker-compose.yml')
                
        except Exception as e:
            print(f'ERROR: docker-compose.yml validation failed: {e}')
            exit(1)
        "

    - name: Verify entrypoint script
      run: |
        # Check that entrypoint.sh is executable and has valid syntax
        chmod +x entrypoint.sh
        shellcheck entrypoint.sh || echo "Entrypoint script validation completed with warnings"

    - name: Check for large files
      run: |
        # Check for large files that shouldn't be in the repo
        large_files=$(find . -type f -size +10M ! -path "./env/*" ! -path "./logs/*" ! -path "./coverage/*" ! -path "./.git/*")
        
        if [ -n "$large_files" ]; then
          echo "WARNING: Large files found:"
          echo "$large_files"
        else
          echo "No large files found"
        fi

    - name: Verify test coverage
      run: |
        # Check that test_deployment.py exists and is valid
        if [ -f "tests/test_deployment.py" ]; then
          python -m py_compile tests/test_deployment.py
          echo "✓ test_deployment.py is valid Python"
        else
          echo "ERROR: test_deployment.py not found"
          exit 1
        fi

    - name: Check GitHub Actions workflows
      run: |
        # Verify that our workflow files are valid YAML
        python -c "
        import yaml
        import os
        
        workflow_dir = '.github/workflows'
        if os.path.exists(workflow_dir):
            for filename in os.listdir(workflow_dir):
                if filename.endswith('.yml') or filename.endswith('.yaml'):
                    filepath = os.path.join(workflow_dir, filename)
                    try:
                        with open(filepath, 'r') as f:
                            yaml.safe_load(f)
                        print(f'✓ {filename} is valid YAML')
                    except Exception as e:
                        print(f'✗ {filename} has YAML issues: {e}')
                        exit(1)
        else:
            print('No workflows directory found')
        "

    - name: Final verification summary
      run: |
        echo "✅ All pre-deploy checks completed successfully"
        echo "🚀 Ready for deployment to production"