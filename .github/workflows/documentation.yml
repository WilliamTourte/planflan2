name: Documentation Build

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'app/**'
      - 'source/**'
      - 'requirements-dev.txt'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'app/**'
      - 'source/**'
      - 'requirements-dev.txt'

env:
  PYTHON_VERSION: '3.12'

jobs:
  build-documentation:
    name: Build Sphinx Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'requirements-dev.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements-dev.txt

    - name: Build Sphinx documentation
      run: |
        cd source
        sphinx-build -W -b html . _build/html
        cd ..

    - name: Check for warnings (fail-on-warning)
      run: |
        cd source
        # Count warnings in Sphinx output
        WARNINGS=$(sphinx-build -b html . _build/html 2>&1 | grep -i "warning" | wc -l)
        if [ "$WARNINGS" -gt 0 ]; then
          echo "⚠️ Found $WARNINGS documentation warnings!"
          echo "Please fix these warnings before merging."
          exit 0  # Don't fail the build, just warn
        else
          echo "✅ No documentation warnings found!"
        fi
        cd ..

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: sphinx-documentation
        path: source/_build/html/
        retention-days: 30

    - name: Deploy documentation to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./source/_build/html
        cname: docs.planflan.local  # Update with your actual domain

    - name: Comment PR with documentation link
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '📚 Documentation built successfully!\n\nYou can view the built documentation in the [documentation artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).'
          })
